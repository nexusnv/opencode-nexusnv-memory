name: release

# Release bootstrap (see README "Releases"): repository secret NPM_TOKEN
# starts as a publish-capable token for the FIRST release (npm cannot scope
# a granular token to a package that does not exist yet), then is replaced
# with a package-scoped granular token. This workflow runs the full gates
# and publishes with provenance. UPGRADED: publishes via npm trusted
# publishing (OIDC) — no token needed once the publisher is registered on
# npmjs.com. Keep NPM_TOKEN only as a break-glass fallback.

permissions:
  contents: read
  id-token: write

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      # A Release cut from a tag off another branch would publish unreviewed
      # code: the tagged commit must be on main, and the tag (minus leading
      # v) must equal the manifest version (npm cannot reuse a version, so a
      # mismatch would either publish the wrong version or fail late).
      - name: assert release tag matches main and manifest
        run: |
          TAG="${GITHUB_REF_NAME}"
          test "$(git rev-list -n1 "$TAG")" = "$(git rev-parse HEAD)" || { echo "release tag $TAG does not point at HEAD"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "release commit is not on main"; exit 1; }
          TAG="$TAG" node -e "const v=require('./package.json').version; const t=process.env.TAG.replace(/^v/,''); if(v!==t){console.error('tag '+process.env.TAG+' != package.json '+v);process.exit(1)} console.log('release ok: '+t)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: |
          TARBALL=$(npm pack --silent)
          node scripts/assert-pack.mjs "$TARBALL"
      # Trusted publishing (OIDC) needs npm >= 11.5.1; the runner-bundled
      # npm is not guaranteed new enough, so upgrade first. No NODE_AUTH_TOKEN
      # here by design: any token present makes npm skip the OIDC exchange.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
