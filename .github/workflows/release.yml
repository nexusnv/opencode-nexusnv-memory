name: release

# First release is manual bootstrap (see README "Releases"): create a
# granular NPM_TOKEN (publish-only, scoped to opencode-nexusnv-memory) as a
# repository secret, then publish a GitHub Release. This workflow runs the
# full gates and publishes with provenance. Long-term upgrade path: switch
# to npm trusted publishing (OIDC) and drop the token.

permissions:
  contents: read
  id-token: write

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: |
          TARBALL=$(npm pack --silent)
          node scripts/assert-pack.mjs "$TARBALL"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
