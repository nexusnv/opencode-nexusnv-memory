name: release

# Two jobs by design (see Sourcery/CodeRabbit review on PR #11):
# - build: typecheck + coverage + tag guards. NO id-token here, so
#   dependency lifecycle scripts can never run in a job that can mint
#   publish credentials.
# - publish: minimal OIDC-only job. No `npm ci` (no dependency code runs
#   here at all), no registry-url (setup-node would otherwise write an
#   auth entry referencing NODE_AUTH_TOKEN, which makes npm skip the OIDC
#   exchange), pinned npm (OIDC needs >= 11.5.1; `latest` is mutable).
#
# Staged publishing only: the trusted publisher is registered stage-only,
# so CI stages the asserted tarball and a maintainer approves it on
# npmjs.com (with 2FA) before it goes live. Nothing direct-publishes.
#
# Break-glass: workflow_dispatch with token_fallback runs the same release
# checks but stages with NPM_TOKEN instead of OIDC (see CONTRIBUTING.md).

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      token_fallback:
        description: "Break-glass: publish with NPM_TOKEN instead of OIDC"
        type: boolean
        default: false

jobs:
  # Manual dispatches are main-only: the tag guards below run on release
  # events, so without this gate a dispatch from any branch or tag could
  # publish unreviewed code. Release tags bypass this (their own guards).
  build:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
      # Release events only: a Release cut from a tag off another branch
      # would publish unreviewed code, and a tag/manifest mismatch would
      # publish the wrong version (npm cannot reuse versions). Manual
      # dispatches run from main by procedure, so there is no tag to check.
      - name: assert release tag matches main and manifest
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME}"
          test "$(git rev-list -n1 "$TAG")" = "$(git rev-parse HEAD)" || { echo "release tag $TAG does not point at HEAD"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "release commit is not on main"; exit 1; }
          TAG="$TAG" node -e "const v=require('./package.json').version; const t=process.env.TAG.replace(/^v/,''); if(v!==t){console.error('tag '+process.env.TAG+' != package.json '+v);process.exit(1)} console.log('release ok: '+t)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
      # Self-check: any configured token auth makes npm skip OIDC, so refuse
      # to publish rather than fail late with an auth error. (Checked in
      # the npmrc files directly: `npm config list` does not surface
      # registry-scoped auth keys.)
      - name: assert no token auth configured (OIDC path clear)
        if: ${{ !inputs.token_fallback }}
        run: |
          hit=""
          for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" .npmrc; do
            if [ -n "$f" ] && [ -f "$f" ] && grep -qE '_authToken|_password' "$f"; then
              hit="$f"
            fi
          done
          if [ -n "$hit" ]; then
            echo "token auth is configured in $hit; refusing OIDC publish"; exit 1
          fi
          echo "no token auth configured (OIDC path clear)"
      - run: npm install -g npm@12.2.0
      - name: pack and assert entry point
        run: |
          TARBALL=$(npm pack --silent)
          node scripts/assert-pack.mjs "$TARBALL"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
      # Idempotent retry: a previous run may have submitted this version
      # then lost the response (runner timeout). Re-submitting an already
      # staged version fails, so treat a matching pending stage as success
      # and point at it instead. Shape-agnostic: any stage entry mentioning
      # this exact version counts (entries here are per-package versions).
      - name: skip submit when this version is already staged
        id: staged
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          LIST=$(npm stage list "$NAME" --json 2>/dev/null || echo "[]")
          if LIST="$LIST" VER="$VER" node -e "let a; try { a = JSON.parse(process.env.LIST); } catch { process.exit(1); } if (!Array.isArray(a)) process.exit(1); process.exit(a.some((e) => JSON.stringify(e).includes(process.env.VER)) ? 0 : 1)"; then
            echo "version $VER is already staged; skipping re-submission (approve it on npmjs.com)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: publish via OIDC
        if: ${{ !inputs.token_fallback && steps.staged.outputs.skip != 'true' }}
        run: npm stage publish "$TARBALL" --provenance --access public
      - name: stage via token fallback (break-glass only)
        if: ${{ inputs.token_fallback && steps.staged.outputs.skip != 'true' }}
        # Bare NODE_AUTH_TOKEN does not configure registry-scoped auth on a
        # clean runner (and npm would try OIDC first), so write the entry
        # explicitly. No provenance here: attestation needs OIDC identity.
        # Staged like the normal path: a maintainer still approves it.
        run: |
          npm config set '//registry.npmjs.org/:_authToken' "${NODE_AUTH_TOKEN}" --location=user
          npm stage publish "$TARBALL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
